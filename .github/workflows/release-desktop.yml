name: Desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Run workspace tests
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build desktop release
        run: cargo build -p mattmoss --release --locked --target ${{ matrix.target }}
      - name: Package Linux and macOS executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package release-assets
          cp "target/$TARGET/release/mattmoss" README.md CHANGELOG.md package/
          tar -czf "release-assets/mattmoss-$TARGET.tar.gz" -C package .
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, release-assets | Out-Null
          Copy-Item "target/$env:TARGET/release/mattmoss.exe", README.md, CHANGELOG.md -Destination package
          Compress-Archive -Path package/* -DestinationPath "release-assets/mattmoss-$env:TARGET.zip"
      - name: Upload packaged desktop
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [checks, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$TAG" release-assets/* \
            --verify-tag --title "Mattmoss $TAG" --generate-notes "${prerelease[@]}"
